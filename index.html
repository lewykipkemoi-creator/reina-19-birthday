<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy 19th Reina 🎉</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap');
body{margin:0;min-height:100vh;background:linear-gradient(135deg,#ffdde1,#ee9ca7);font-family:'Poppins',sans-serif;display:flex;justify-content:center;align-items:center;overflow:hidden;text-align:center}
.card{background:white;padding:25px;border-radius:24px;box-shadow:0 20px 50px rgba(0,0,0,.2);max-width:380px;width:92%}
h1{font-family:'Great Vibes',cursive;font-size:48px;color:#ff4d6d;margin:10px 0 5px}
.photos{display:flex;gap:10px;justify-content:center;margin:15px 0}
.photos img{width:48%;border-radius:16px;height:180px;object-fit:cover;box-shadow:0 8px 20px rgba(0,0,0,.15)}
#game-area{position:relative;width:100%;height:230px;background:#fff0f3;border-radius:20px;margin-top:15px;border:2px dashed #ffb3c1;overflow:hidden}
#message{font-weight:600;color:#ff4d6d;height:24px;margin-top:10px}
#playBtn{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#ff4d6d;color:white;border:none;padding:14px 32px;border-radius:50px;font-size:18px;font-weight:600;box-shadow:0 10px 20px rgba(255,77,109,.4);transition:all.2s ease;touch-action:none}
#videoModal{display:none;position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.85);justify-content:center;align-items:center;padding:15px}
#videoModal.show{display:flex}
#videoModal video{width:100%;max-width:400px;border-radius:20px}
#closeVideo{position:absolute;top:20px;right:20px;background:white;border:none;width:40px;height:40px;border-radius:50%;font-size:20px}
</style>
</head>
<body>
<div class="card">
<h1>Happy 19th Reina!</h1>
<p style="color:#888">I have a surprise for you...</p>
<div class="photos"><img src="assets/reina-portrait.jpg"><img src="assets/reina-flowers.jpg"></div>
<div id="message">Can you catch the button? 😏</div>
<div id="game-area"><button id="playBtn">Play Me 💖</button></div>
<p style="font-size:12px;color:#aaa;margin-top:10px">Try to click me if you can hehe</p>
</div>
<div id="videoModal"><button id="closeVideo">✕</button><video id="reinaVideo" controls playsinline><source src="assets/20260904_101156.mp4" type="video/mp4"></video></div>
<script>
const btn=document.getElementById('playBtn'),game=document.getElementById('game-area'),msg=document.getElementById('message'),modal=document.getElementById('videoModal'),video=document.getElementById('reinaVideo'),closeBtn=document.getElementById('closeVideo');let attempts=0;const maxAttempts=7;const texts=["Can you catch the button? 😏","Oops too slow! 😝","Haha not that easy!","You almost got me!","Why so slow Reina? 😂","Okay last chance...","Awww fine you win! 🥺💖","Playing your surprise... 🎬"];function moveButton(){attempts++;if(attempts<maxAttempts){msg.textContent=texts[attempts];const maxX=game.clientWidth-btn.offsetWidth-10,maxY=game.clientHeight-btn.offsetHeight-10;btn.style.left=Math.random()*maxX+'px';btn.style.top=Math.random()*maxY+'px';btn.style.transform='translate(0,0)';btn.style.scale=1-attempts*0.06}else{msg.textContent=texts[7];btn.textContent='Okay Play! ▶️';btn.style.left='50%';btn.style.top='50%';btn.style.transform='translate(-50%,-50%)';btn.style.scale='1.2';btn.style.background='#2ec4b6';btn.onclick=playVideo} }function playVideo(){modal.classList.add('show');video.play()}btn.addEventListener('mouseenter',moveButton);btn.addEventListener('touchstart',e=>{e.preventDefault();moveButton()});btn.addEventListener('click',e=>{if(attempts<maxAttempts){e.preventDefault();moveButton()}else{playVideo()}});closeBtn.onclick=()=>{modal.classList.remove('show');video.pause()};modal.onclick=e=>{if(e.target===modal){modal.classList.remove('show');video.pause()}};
</script>
</body>
</html>
